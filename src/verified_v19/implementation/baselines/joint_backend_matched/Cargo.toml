[package]
name = "joint-backend-matched"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0 OR MIT"

[dependencies]
plan-a-joint-circuit = { path = "../.." }
ark-bls12-381 = "0.4"
ark-ec = "0.4"
ark-ed-on-bls12-381 = { version = "0.4", features = ["r1cs"] }
ark-ff = "0.4"
ark-groth16 = "0.4"
ark-r1cs-std = "0.4"
ark-relations = "0.4"
ark-serialize = "0.4"
ark-snark = "0.4"
ark-std = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
num-bigint = "0.4"
num-traits = "0.2"
legogroth16 = { path = "../../../third_party/dock-crypto-source/legogroth16" }
